name: Build gps_debug_gui standalone

on:
  push:
    branches: [release]
    paths:
      - "scripts/gps_debug/**"
      - ".github/workflows/build-gps-debug-gui.yml"
  pull_request:
    paths:
      - "scripts/gps_debug/**"
      - ".github/workflows/build-gps-debug-gui.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller dronecan pymavlink pyserial

      - name: Build standalone (PyInstaller)
        run: |
          python scripts/gps_debug/build.py --clean

      - name: Rename binary with OS suffix
        shell: bash
        run: |
          mkdir -p artefacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/gps_debug_gui.exe "artefacts/gps_debug_gui-windows.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/gps_debug_gui "artefacts/gps_debug_gui-macos"
          else
            cp dist/gps_debug_gui "artefacts/gps_debug_gui-linux"
          fi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: gps_debug_gui-${{ runner.os }}
          path: artefacts/
          if-no-files-found: error
