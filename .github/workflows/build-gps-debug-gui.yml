name: Build gps_debug_gui standalone

on:
  push:
    branches: [release]
    paths:
      - "scripts/gps_debug/**"
      - ".github/workflows/build-gps-debug-gui.yml"
  pull_request:
    paths:
      - "scripts/gps_debug/**"
      - ".github/workflows/build-gps-debug-gui.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller dronecan pymavlink pyserial

      - name: Build standalone (PyInstaller)
        run: |
          python scripts/gps_debug/build.py --clean

      # Each OS produces a different artefact shape:
      #   Windows: dist/gps_debug_gui.exe   (single .exe from --onefile)
      #   macOS:   dist/gps_debug_gui.app/  (.app bundle; --onedir is forced
      #            because PyInstaller deprecated --onefile + --windowed on macOS)
      #   Linux:   dist/gps_debug_gui       (single binary from --onefile)
      - name: Upload Windows artefact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gps_debug_gui-windows
          path: dist/gps_debug_gui.exe
          if-no-files-found: error

      - name: Upload macOS artefact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gps_debug_gui-macos
          path: dist/gps_debug_gui.app
          if-no-files-found: error

      - name: Upload Linux artefact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gps_debug_gui-linux
          path: dist/gps_debug_gui
          if-no-files-found: error
