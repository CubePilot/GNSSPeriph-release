name: Build gps_debug_gui standalone

on:
  push:
    branches: [release]
    paths:
      - "scripts/gps_debug/**"
      - ".github/workflows/build-gps-debug-gui.yml"
  pull_request:
    paths:
      - "scripts/gps_debug/**"
      - ".github/workflows/build-gps-debug-gui.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller dronecan pymavlink pyserial

      - name: Build standalone (PyInstaller)
        run: |
          python scripts/gps_debug/build.py --clean

      # Build now uses --onedir on every OS, so each platform produces a
      # directory in dist/ with the binary plus its bundled libs. macOS also
      # gets a parallel .app bundle. upload-artifact strips the lowest-common
      # -ancestor directory when given a single dir path, which would lose the
      # gps_debug_gui/ (or .app/) wrapper. Stage each artefact inside a
      # throwaway parent folder and upload that folder so the wrapper sticks.
      - name: Stage Windows artefact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p win_artefact
          cp -R dist/gps_debug_gui win_artefact/

      - name: Upload Windows artefact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gps_debug_gui-windows
          path: win_artefact
          if-no-files-found: error

      - name: Stage macOS artefact
        if: runner.os == 'macOS'
        run: |
          mkdir -p macos_artefact
          cp -R dist/gps_debug_gui.app macos_artefact/

      - name: Upload macOS artefact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gps_debug_gui-macos
          path: macos_artefact
          if-no-files-found: error

      - name: Stage Linux artefact
        if: runner.os == 'Linux'
        run: |
          mkdir -p linux_artefact
          cp -R dist/gps_debug_gui linux_artefact/

      - name: Upload Linux artefact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gps_debug_gui-linux
          path: linux_artefact
          if-no-files-found: error
